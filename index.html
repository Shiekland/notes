<p>Everything you type here saves automatically. Use the toolbar above to format your writing, with no special symbols needed.</p>
<h2>Notebooks and sub-notes</h2>
<p>Notes live inside notebooks, and notes can hold sub-notes of their own. To add one, use the add sub-note button at the top of a note, or the options beside a note in the sidebar. This note already has one, called A sub-note.</p>
<p>To reorganise, drag notes around in the sidebar, or use <strong>Move to\u2026</strong>, <strong>Move up</strong> and <strong>Move down</strong> in a note\u2019s options.</p>
<h2>Tags and quick notes</h2>
<p>Add tags at the bottom of any note, then click a tag to see every note that has it, whichever notebook it\u2019s in. For things you just want to jot down, open <strong>Quick notes</strong> with the sticky note button at the top, or use them from Home.</p>
<h2>Whiteboards</h2>
<p>Whiteboards are canvases for planning and collecting ideas. Make one with <strong>New whiteboard</strong> on a notebook\u2019s page or in its options. Add text, pictures and links to notes as cards, drag them around, and connect them with arrows by dragging the small arrow button on a card\u2019s edge.</p>
<h2>Links and your safety net</h2>
<p>Type <strong>[[</strong> and start typing a note\u2019s name to link to it. Each note shows the notes that link to it at the bottom.</p>
<p>Deleted things go to <strong>Recently deleted</strong> for 30 days, so you can bring them back. Earlier versions of each note are kept too: find them in <strong>Version history</strong> in a note\u2019s options. To keep a copy of everything elsewhere, use <strong>Backup and export</strong> in Settings.</p>
<h2>Formatting</h2>
<p>Text can be <strong>bold</strong>, <em>italic</em>, <u>underlined</u>, <s>crossed out</s> or <mark>highlighted</mark>, and you can make it <span style="font-size: 14px">smaller</span> or <span style="font-size: 20px">larger</span>. Select some text, then pick an option from the toolbar.</p>
<p>Use <strong>Insert</strong> in the toolbar, or type <strong>/</strong> on a new line, to add pictures, galleries, callouts, quotes, tables, accordions, code and dividers. You can also paste or drag pictures straight in, and tap a picture to resize it, align it or add a caption.</p>
<ul data-type="taskList">
  <li data-type="taskItem" data-checked="true"><p>Checklists you can tick off</p></li>
  <li data-type="taskItem" data-checked="false"><p>Delete this note once you\u2019ve had a look around</p></li>
</ul>
<h2>Handy shortcuts</h2>
<p>Ctrl + B, I and U for bold, italic and underline. Ctrl + K adds a link, and clicking a link opens it in a new tab. Ctrl + S saves straight away, Ctrl + Shift + F jumps to search, and Ctrl + \\ shows or hides the sidebar. On a Mac, use Cmd instead of Ctrl. Press <strong>?</strong> at any time (outside a note\u2019s text) to see every shortcut.</p>

<body>
  <div class="app" id="app" data-sidebar="open">

    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="side-head">
        <a class="brand" href="#/"><span data-icon="app" data-size="18"></span><span>Notes</span></a>
        <button class="icon-btn" id="closeSidebar" type="button" aria-label="Hide sidebar" title="Hide sidebar (Ctrl + \)">
          <span data-icon="panel-left-close"></span>
        </button>
      </div>

      <div class="search">
        <span data-icon="search" data-size="16"></span>
        <input id="search" type="search" placeholder="Search all notes" aria-label="Search all notes" autocomplete="off">
        <button class="search-clear icon-btn" id="searchClear" type="button" aria-label="Clear search" title="Clear search" hidden><span data-icon="close" data-size="16"></span></button>
      </div>

      <nav class="nav" id="nav" aria-label="Notebooks"></nav>

      <div class="results" id="resultsWrap" hidden>
        <ul class="note-list" id="results" aria-label="Search results"></ul>
        <p class="list-empty" id="resultsEmpty" hidden></p>
      </div>

      <div class="side-foot">
        <p class="store-label" id="storeLabel"></p>
        <div class="side-controls">
          <a class="account-btn" id="accountBtn" href="#/settings" aria-label="Settings" title="Settings">
            <span data-icon="settings" data-size="16"></span><span>Settings</span>
          </a>
          <div class="theme-switch" id="themeSwitch" role="group" aria-label="Theme">
            <button type="button" data-theme-choice="system" aria-label="Match device" title="Match device"><span data-icon="monitor" data-size="16"></span></button>
            <button type="button" data-theme-choice="light" aria-label="Light" title="Light"><span data-icon="sun" data-size="16"></span></button>
            <button type="button" data-theme-choice="dark" aria-label="Dark" title="Dark"><span data-icon="moon" data-size="16"></span></button>
          </div>
        </div>
      </div>
    </aside>

    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <main class="main" id="main" data-view="home">
      <header class="topbar">
        <button class="icon-btn" id="openSidebar" type="button" aria-label="Show sidebar" title="Show sidebar (Ctrl + \)">
          <span data-icon="panel-left"></span>
        </button>
        <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
        <div class="note-tools item-only">
          <button class="status" id="status" type="button" aria-live="polite" disabled></button>
          <span class="words" id="words"></span>
          <button class="icon-btn" id="addSubNote" type="button" aria-label="Add sub-note" title="Add sub-note">
            <span data-icon="note-new"></span>
          </button>
          <button class="icon-btn" id="noteMore" type="button" aria-label="More options" title="More options" aria-haspopup="menu" aria-expanded="false">
            <span data-icon="more"></span>
          </button>
        </div>
        <button class="icon-btn panel-toggle" id="stickyToggle" type="button" aria-label="Quick notes" title="Quick notes" aria-pressed="false" aria-expanded="false">
          <span data-icon="sticky"></span>
        </button>
      </header>

      <section class="view home-only" id="homeView" aria-label="Notebooks"></section>
      <section class="view notebook-only" id="notebookView" aria-label="Notebook"></section>
      <section class="board-view board-only" id="boardView" aria-label="Board"></section>
      <section class="view tag-only" id="tagView" aria-label="Tag"></section>
      <section class="view trash-only" id="trashView" aria-label="Recently deleted"></section>
      <section class="view settings-only" id="settingsView" aria-label="Settings"></section>

      <h1 class="visually-hidden" id="pageHeading" hidden></h1>
      <div class="toolbar note-only" id="toolbar" role="toolbar" aria-label="Formatting"></div>
      <div class="view note-only" id="scroller">
        <div class="page" id="page">
          <input class="title-input" id="title" type="text" placeholder="Untitled" aria-label="Note title" autocomplete="off">
          <div id="editor"></div>
          <div class="note-tags" id="noteTags" aria-label="Tags"></div>
          <div class="note-backlinks" id="noteBacklinks" aria-label="Linked from" hidden></div>
        </div>
      </div>
    </main>

    <div class="scrim panel-scrim" id="panelScrim" aria-hidden="true" hidden></div>
    <aside class="quick-panel" id="stickyPanel" aria-label="Quick notes"></aside>

  </div>
</body>
</html>
